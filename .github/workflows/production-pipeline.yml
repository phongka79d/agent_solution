# Gate P0 CI pipeline (implement/09 §4). Every gate below is fail-closed:
# `scripts/require-implemented-tasks.mjs` checks the Turborepo task graph first
# and refuses a task that no workspace package implements, because `turbo run`
# exits 0 with "0 total" for a declared-but-unimplemented task. A green run
# therefore means each named suite actually executed.
#
# The suite tasks are implemented by workspace packages, each with its own vitest
# config, and never by an empty wrapper script:
#   test:contracts    packages/core-engine  (vitest.contracts.config.ts)
#   test:adversarial  packages/core-engine  (vitest.adversarial.config.ts)
#                     packages/database     (vitest.adversarial.config.ts)
#   test:security     packages/core-engine  (vitest.security.config.ts)
#                     packages/database     (vitest.security.config.ts)
# Every one of them is offline (no PostgreSQL, no Redis, no network), so this
# pipeline needs no service for them; the live half of the durable invariants is
# job 3 (`pnpm test:rls-policies`) and, for the gate's own evidence, the
# gate-environment rehearsal. A green suite here proves the named offline cases
# ran — it does not close a durability item that needs the real durable store.
#
# `test:pilots` is implemented by apps/worker and runs the executable offline
# E2E-OFF-ESC/PILOT-04 harness. It is included here as local regression evidence;
# the database and production-like pilot boundaries remain the live gate evidence.
# `test:e2e` is implemented by apps/worker (`vitest.e2e.config.ts`, `src/e2e/**/*.e2e.test.ts`)
# and is required in this pipeline. Offline mocks are engineering regression, not live Gate P4 evidence.
# P5 live repository smoke runs under the same migrated NOBYPASSRLS application role
# in job 3. The deterministic load smoke in job 1 is not a 10k benchmark/SLO claim.
#
# Nothing in this pipeline publishes: `permissions` is read-only, and the Docker
# job only builds images into the local daemon, inspects them, boots the Compose
# stack for its health gates, and tears its own project down.
name: Production Quality and Verification Pipeline

# `init/agent-solution` is the repository's current default branch, so it is the
# base of every pull request in this phase and MUST be listed for both events:
# a workflow that only names `main` never validates the code that actually lands.
on:
  push:
    branches: [main, 'init/agent-solution', 'refactor/agent-solution', 'release/*', 'feat/**']
  pull_request:
    branches: [main, 'init/agent-solution']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: 1. Static Analysis and Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No `version` input: the workspace pins pnpm in `packageManager`
      # (`pnpm@9.1.0`), and an explicit version that disagrees with that pin is
      # refused by the action. The pin is the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Check migration numbering
        run: pnpm check:migrations
      - name: Run repository script tests
        run: |
          node --test scripts/*.test.mjs
          node --test scripts/**/*.test.mjs
      - name: Check demo boundary
        run: pnpm check:demo-boundary
      # Every Turborepo task this pipeline invokes is checked in one place, so a
      # gate whose implementer disappears fails here — before lint, tests or
      # images — instead of reporting "0 total" as a green suite in job 2, 3 or 4.
      - name: Require every gate task this pipeline invokes to be implemented
        run: >-
          node scripts/require-implemented-tasks.mjs lint typecheck build test:unit test:contracts test:pilots test:e2e
          test:adversarial test:security db:migrate:rehearse
      - name: Check generated testcase artifacts against authoritative sources
        run: python testcases/_generate.py --check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Build every workspace package
        run: NEXT_STANDALONE=1 pnpm build
      - name: Verify deterministic P5 load smoke safety counters
        run: node tests/load/p5-load-harness.mjs --profile smoke --assert-safe-smoke
      - name: Upload built outputs and Turbo cache for downstream shards
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-build
          if-no-files-found: error
          include-hidden-files: true
          path: |
            apps/**/dist/**
            packages/**/dist/**
            apps/tenant-console/.next/standalone/**
            apps/platform-admin/.next/standalone/**
            .turbo/**
            apps/tenant-console/.next/**
            apps/platform-admin/.next/**

  ui-smoke:
    name: Browser UI Smoke (desktop and mobile)
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Download static build outputs and Turbo cache
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-build
          path: .
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run desktop and mobile UI smoke
        run: pnpm test:ui
      - name: Upload UI smoke screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-screenshots
          if-no-files-found: error
          path: test-results/ui/**


  unit-core:
    name: 2. Core and Package Unit Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Download static build outputs and Turbo cache
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-build
          path: .
      - name: Require the core unit task to be implemented
        run: node scripts/require-implemented-tasks.mjs test:unit
      - name: Unit tests for every workspace except worker
        run: pnpm turbo run test:unit --filter '!@agentos/worker'
      - name: Offline mock-ERP service tests
        run: node --test services/mock-erp/test/server.test.mjs

  unit-worker:
    name: 3. Worker Unit Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Download static build outputs and Turbo cache
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-build
          path: .
      - name: Require the worker unit task to be implemented
        run: node scripts/require-implemented-tasks.mjs test:unit
      - name: Worker unit tests
        run: pnpm --filter @agentos/worker test:unit

  contracts:
    name: 4. Contract Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Download static build outputs and Turbo cache
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-build
          path: .
      - name: Require the contract task to be implemented
        run: node scripts/require-implemented-tasks.mjs test:contracts
      - name: Contract tests
        run: pnpm test:contracts

  adversarial:
    name: 5. Adversarial Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Download static build outputs and Turbo cache
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-build
          path: .
      - name: Require the adversarial task to be implemented
        run: node scripts/require-implemented-tasks.mjs test:adversarial
      - name: Adversarial tests
        run: pnpm test:adversarial

  security:
    name: 6. Security Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Download static build outputs and Turbo cache
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-build
          path: .
      - name: Require the security task to be implemented
        run: node scripts/require-implemented-tasks.mjs test:security
      - name: Security tests
        run: pnpm test:security

  pilots:
    name: 7. Pilot Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Download static build outputs and Turbo cache
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-build
          path: .
      - name: Require the pilot task to be implemented
        run: node scripts/require-implemented-tasks.mjs test:pilots
      - name: Offline pilot harness
        run: pnpm --filter @agentos/worker test:pilots

  e2e:
    name: 8. Worker E2E Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Download static build outputs and Turbo cache
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-build
          path: .
      - name: Require the E2E task to be implemented
        run: node scripts/require-implemented-tasks.mjs test:e2e
      - name: Worker E2E regression suite
        run: pnpm --filter @agentos/worker test:e2e

  database-migration-rehearsal:
    name: 9. Raw SQL Migration and RLS Rehearsal
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same image as docker-compose.yml, so the rehearsal runs against the
        # extensions the durable local/CI store actually ships (docker/postgres/init.sql).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: agent_os_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d agent_os_rehearsal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Download static build outputs and Turbo cache
        uses: actions/download-artifact@v4
        with:
          name: static-analysis-build
          path: .
      # The RLS suite connects as a NOBYPASSRLS role and the migration grants
      # privileges to it only when it already exists, so the repository's own
      # local/CI bootstrap (init.sql then init-roles.sh) runs first. The role
      # bootstrap refuses POSTGRES_ENV values outside local/ci.
      - name: Bootstrap extensions, schema, and least-privilege roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGPASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: agent_os_rehearsal
          POSTGRES_ENV: ci
          APP_ROLE_PASSWORD: agentos_app_password
          MIGRATOR_ROLE_PASSWORD: agentos_migrator_password
        run: |
          psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --file docker/postgres/init.sql
          bash docker/postgres/init-roles.sh
      - name: Require the migration rehearsal task to be implemented
        run: node scripts/require-implemented-tasks.mjs db:migrate:rehearse
      - name: Apply and replay the raw SQL migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/agent_os_rehearsal
        run: pnpm db:migrate:rehearse
      # These live database gates remain ordered because they share one
      # PostgreSQL instance, tenant fixtures, and append-only audit/evidence rows.
      # The rehearsal writes its synthetic fixtures with the privileged connecting role and then
      # asserts every RLS denial through `SET LOCAL ROLE agentos_app`, so it is the one gate that
      # needs the bootstrap URL; the policy, P5 and integration gates run as `agentos_app`.
      - name: Verify the RLS rehearsal fixtures and app-role denials
        env:
          DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/agent_os_rehearsal
        run: pnpm test:rls-rehearsal
      - name: Verify the RLS policies from the NOBYPASSRLS application role
        env:
          DATABASE_URL: postgresql://agentos_app:agentos_app_password@127.0.0.1:5432/agent_os_rehearsal
        run: pnpm test:rls-policies
      - name: Verify P5 provisioning and autonomy repositories on real PostgreSQL
        env:
          APP_ENV: ci
          DATABASE_URL: postgresql://agentos_app:agentos_app_password@127.0.0.1:5432/agent_os_rehearsal
        run: pnpm test:p5-db
      # The P1 Customer Care path has no skip path either: it drives the gateway,
      # the durable task store, the skill runtime and the evidence/audit writers
      # against the rehearsed schema, and fails when a prerequisite is missing.
      - name: Verify the P1 Customer Care and P2 Sales execution paths end to end
        env:
          APP_ENV: ci
          NODE_ENV: test
          DATABASE_URL: postgresql://agentos_app:agentos_app_password@127.0.0.1:5432/agent_os_rehearsal
          WORKER_TENANT_IDS: 11111111-1111-1111-1111-111111111111
          CARE_TENANT_IDS: 11111111-1111-1111-1111-111111111111
          # The Sales smoke is scoped to the tenant the mock system of record's fixtures are bound
          # to (services/mock-erp/src/fixtures.mjs); Care keeps its own pilot tenant above, so the
          # two smokes never share fixtures, tenants or effect state.
          SALES_TENANT_IDS: 00000000-0000-4000-8000-000000000001
          # The P4 smoke is scoped to its own tenant and proves the durable handoff ledger against
          # the rehearsed schema; it drives no API or worker, so it needs neither provider.
          P4_TENANT_IDS: 22222222-2222-4222-8222-222222222222
          SESSION_SECRET: ci-session-secret-0000000000
          PLATFORM_SECRET: ci-platform-secret-0000000
          AUDIT_HMAC_SECRET: ci-audit-hmac-secret-000000
          MOCK_SECRET_KEY: ci-mock-erp-shared-secret
        run: pnpm test:integration

  docker-build-load-and-smoke:
    name: 10. Named Image Build, Local Load, Inspect, and Boot (no publish)
    needs:
      - unit-core
      - unit-worker
      - contracts
      - adversarial
      - security
      - pilots
      - e2e
      - database-migration-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      # This job runs the repository's plain-Node smoke — `scripts/docker-smoke.mjs`,
      # the same file the root `pnpm docker:smoke` script wraps. It drives `docker`
      # and `docker compose` directly and installs nothing into the workspace, so this
      # job needs neither pnpm setup nor `pnpm install`.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Compose refuses to start without the required variables; .env.example is
      # the repository's documented local/CI placeholder file and stays
      # gitignored (never committed) in the runner's workspace.
      - name: Provide the local/CI environment file Compose reads
        run: cp .env.example .env
      # Builds api/worker/tenant-console/platform-admin from docker/Dockerfile.*,
      # loads and inspects each image, boots the default Compose profile, waits for all
      # four application services to become healthy, then tears down its own Compose
      # project. No image is pushed, published, or tagged for a registry.
      - name: Build, load, inspect, and boot the named images
        run: node scripts/docker-smoke.mjs --project agentos-ci-smoke --env-file .env --wait-seconds 600
