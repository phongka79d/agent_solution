name: Chaos Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chaos:
    name: Isolated stack chaos and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Run isolated chaos and recovery scenarios
        run: pnpm test:chaos
