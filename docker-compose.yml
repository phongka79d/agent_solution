# Local/CI topology only. Do not use this file for staging, sandbox, or production.
# Copy .env.example to .env before `docker compose up`, or pass `--env-file .env.example`
# for a placeholder local boot. Required secrets use ${VAR:?} so an empty value fails
# closed. mock-erp is labeled local-ci-only and exits unless APP_ENV is local or ci.
# Published ports bind to ${BIND_ADDRESS:-127.0.0.1}; set BIND_ADDRESS deliberately
# when local access from another host is required.

# Single source for the Qdrant API key. `QDRANT_API_KEY` is the only variable a
# caller sets: the qdrant service's own key and both clients alias this one
# anchored value, and QDRANT__SERVICE__API_KEY is never interpolated apart from
# it. The validator refuses a startup where the two are set to different values.
x-qdrant-api-key: &qdrant-api-key ${QDRANT_API_KEY:?QDRANT_API_KEY is required}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentos_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
      POSTGRES_ENV: ${POSTGRES_ENV:-local}
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD:?APP_ROLE_PASSWORD is required}
      MIGRATOR_ROLE_PASSWORD: ${MIGRATOR_ROLE_PASSWORD:?MIGRATOR_ROLE_PASSWORD is required}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentos_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentos-network

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agentos-network

  qdrant:
    image: qdrant/qdrant:v1.9.2
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT__SERVICE__HTTP_PORT:-6333}:6333"
      - "${BIND_ADDRESS:-127.0.0.1}:${QDRANT__SERVICE__GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__ENABLE_CORS: "true"
      QDRANT__SERVICE__API_KEY: *qdrant-api-key
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /healthz HTTP/1.0\r\n\r\n" >&3 && grep -q "200" <&3'
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentos-network

  mock-erp:
    build:
      context: ./services/mock-erp
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      agentos.deploy: local-ci-only
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MOCK_ERP_PORT:-8081}:8081"
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: 8081
      MOCK_SECRET_KEY: ${MOCK_SECRET_KEY:?MOCK_SECRET_KEY is required}
      SIMULATE_LATENCY_MS: ${SIMULATE_LATENCY_MS:-50}
      SIMULATE_FAILURE_RATE: ${SIMULATE_FAILURE_RATE:-0.0}
      MOCK_ERP_DEMO_PACK: ${MOCK_ERP_DEMO_PACK:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8081/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agentos-network

  temporal:
    profiles: ["workflows"]
    image: temporalio/auto-setup:1.23.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:7233:7233"
    networks:
      - agentos-network

  temporal-ui:
    profiles: ["workflows"]
    image: temporalio/ui:2.26.2
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    networks:
      - agentos-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      PORT: 4000
      SERVICE_NAME: ${SERVICE_NAME:-agentos-api}
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      WEB_BASE_URL: ${WEB_BASE_URL:?WEB_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://agentos_app:${APP_ROLE_PASSWORD:?APP_ROLE_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-agentos_dev}?schema=agentos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: *qdrant-api-key
      # Same anchored value as the qdrant service, so the process-level equality
      # check in the env validator sees one key instead of two.
      QDRANT__SERVICE__API_KEY: *qdrant-api-key
      MOCK_ERP_ENABLED: ${MOCK_ERP_ENABLED:-true}
      ENABLED_AGENT_MODULES: ${ENABLED_AGENT_MODULES:-}
      SALES_SIGNAL_SOURCE_CHANNELS: ${SALES_SIGNAL_SOURCE_CHANNELS:-}
      SALES_SIGNAL_EVENT_TYPES: ${SALES_SIGNAL_EVENT_TYPES:-}
      MARKETING_SIGNAL_SOURCE_CHANNELS: ${MARKETING_SIGNAL_SOURCE_CHANNELS:-}
      MARKETING_SIGNAL_EVENT_TYPES: ${MARKETING_SIGNAL_EVENT_TYPES:-}
      DEMO_PROVIDER_MODE: ${DEMO_PROVIDER_MODE:-offline}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID:-99999999-9999-4999-8999-999999999999}
      # API knowledge reads use the same approved root and tenant fence as the worker.
      KNOWLEDGE_ROOT: ${KNOWLEDGE_ROOT:-/repo/packages/second-brain/demo/novamart}
      KNOWLEDGE_TENANT_IDS: ${KNOWLEDGE_TENANT_IDS:-}
      DEMO_COMPANY_ADMIN_EMAIL: ${DEMO_COMPANY_ADMIN_EMAIL:-}
      DEMO_COMPANY_ADMIN_PASSWORD: ${DEMO_COMPANY_ADMIN_PASSWORD:-}
      DEMO_PLATFORM_ADMIN_EMAIL: ${DEMO_PLATFORM_ADMIN_EMAIL:-}
      DEMO_PLATFORM_ADMIN_PASSWORD: ${DEMO_PLATFORM_ADMIN_PASSWORD:-}
      DEMO_WIDGET_ORIGINS: ${DEMO_WIDGET_ORIGINS:-http://localhost:3000}
      ERP_API_BASE_URL: http://mock-erp:8081/api/v1
      # The shared secret the platform signs API-001 calls with; the mock-erp container verifies
      # the same value. Required only while MOCK_ERP_ENABLED is true.
      MOCK_SECRET_KEY: ${MOCK_SECRET_KEY:?MOCK_SECRET_KEY is required}
      EVENT_INGESTION_BASE_URL: http://mock-erp:8081/events/v1
      EVENT_INGESTION_HMAC_SECRET: ${EVENT_INGESTION_HMAC_SECRET:?EVENT_INGESTION_HMAC_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?WEBHOOK_HMAC_SECRET is required}
      PLATFORM_SECRET: ${PLATFORM_SECRET:?PLATFORM_SECRET is required}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:?AUDIT_HMAC_SECRET is required}
      ENCRYPTION_KEY_AES256: ${ENCRYPTION_KEY_AES256:?ENCRYPTION_KEY_AES256 is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai-compatible}
      PRIMARY_REASONING_MODEL: ${PRIMARY_REASONING_MODEL:-gpt-4o}
      FAST_COMPLETION_MODEL: ${FAST_COMPLETION_MODEL:-gpt-4o-mini}
      OPENAI_STRUCTURED_OUTPUT_MODE: ${OPENAI_STRUCTURED_OUTPUT_MODE:-json_object}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-30000}
      MAX_TOKENS_PER_RUN: ${MAX_TOKENS_PER_RUN:-4096}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agentos-network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-4001}
      # Explicit tenant schedule scope; blank disables worker polling rather than bypassing RLS.
      WORKER_TENANT_IDS: ${WORKER_TENANT_IDS:-}
      SERVICE_NAME: agentos-worker
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      WEB_BASE_URL: ${WEB_BASE_URL:?WEB_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://agentos_app:${APP_ROLE_PASSWORD:?APP_ROLE_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-agentos_dev}?schema=agentos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: *qdrant-api-key
      # Same anchored value as the qdrant service, so the process-level equality
      # check in the env validator sees one key instead of two.
      QDRANT__SERVICE__API_KEY: *qdrant-api-key
      MOCK_ERP_ENABLED: ${MOCK_ERP_ENABLED:-true}
      ENABLED_AGENT_MODULES: ${ENABLED_AGENT_MODULES:-}
      SALES_SIGNAL_SOURCE_CHANNELS: ${SALES_SIGNAL_SOURCE_CHANNELS:-}
      SALES_SIGNAL_EVENT_TYPES: ${SALES_SIGNAL_EVENT_TYPES:-}
      MARKETING_SIGNAL_SOURCE_CHANNELS: ${MARKETING_SIGNAL_SOURCE_CHANNELS:-}
      DEMO_PROVIDER_MODE: ${DEMO_PROVIDER_MODE:-offline}
      MARKETING_SIGNAL_EVENT_TYPES: ${MARKETING_SIGNAL_EVENT_TYPES:-}
      # Shared approved Second Brain root and tenant fence. The path is container-absolute.
      KNOWLEDGE_ROOT: ${KNOWLEDGE_ROOT:-/repo/packages/second-brain/demo/novamart}
      KNOWLEDGE_TENANT_IDS: ${KNOWLEDGE_TENANT_IDS:-}
      ERP_API_BASE_URL: http://mock-erp:8081/api/v1
      # The shared secret the platform signs API-001 calls with; the mock-erp container verifies
      # the same value. Required only while MOCK_ERP_ENABLED is true.
      MOCK_SECRET_KEY: ${MOCK_SECRET_KEY:?MOCK_SECRET_KEY is required}
      QUOTE_SIGNING_SECRET: ${QUOTE_SIGNING_SECRET:-}
      EVENT_INGESTION_BASE_URL: http://mock-erp:8081/events/v1
      EVENT_INGESTION_HMAC_SECRET: ${EVENT_INGESTION_HMAC_SECRET:?EVENT_INGESTION_HMAC_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?WEBHOOK_HMAC_SECRET is required}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:?AUDIT_HMAC_SECRET is required}
      ENCRYPTION_KEY_AES256: ${ENCRYPTION_KEY_AES256:?ENCRYPTION_KEY_AES256 is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai-compatible}
      PRIMARY_REASONING_MODEL: ${PRIMARY_REASONING_MODEL:-gpt-4o}
      FAST_COMPLETION_MODEL: ${FAST_COMPLETION_MODEL:-gpt-4o-mini}
      OPENAI_STRUCTURED_OUTPUT_MODE: ${OPENAI_STRUCTURED_OUTPUT_MODE:-json_object}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-30000}
      MAX_TOKENS_PER_RUN: ${MAX_TOKENS_PER_RUN:-4096}

      # Empty keeps Temporal out of the readiness gate. Set only with --profile workflows.
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agentos-network

  tenant-console:
    build:
      context: .
      dockerfile: docker/Dockerfile.tenant-console
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      PORT: 3000
      DEMO_MODE: ${DEMO_MODE:-false}
      API_BASE_URL: http://api:4000
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${TENANT_NEXTAUTH_SECRET:?TENANT_NEXTAUTH_SECRET is required}
      # Required only when DEMO_MODE=true; never reuse NEXTAUTH_SECRET for cookie signing.
      TENANT_COOKIE_HMAC_KEY: ${TENANT_COOKIE_HMAC_KEY:-}
      # Origin only. Browser clients append /api/v1 themselves.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      PLATFORM_ADMIN_URL: ${PLATFORM_ADMIN_URL:?PLATFORM_ADMIN_URL is required}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentos-network

  platform-admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.platform-admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PLATFORM_ADMIN_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      PORT: 3001
      DEMO_MODE: ${DEMO_MODE:-false}
      API_BASE_URL: http://api:4000
      NEXTAUTH_URL: ${PLATFORM_ADMIN_URL:?PLATFORM_ADMIN_URL is required}
      NEXTAUTH_SECRET: ${PLATFORM_NEXTAUTH_SECRET:?PLATFORM_NEXTAUTH_SECRET is required}
      # Required only when DEMO_MODE=true; never reuse NEXTAUTH_SECRET for cookie signing.
      PLATFORM_COOKIE_HMAC_KEY: ${PLATFORM_COOKIE_HMAC_KEY:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentos-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  agentos-network:
    driver: bridge
